format: ea-stodjare-semantic-eval-suite
version: "1.0"
name: EA Stödjare – semantiska evals v1
language: sv-SE
purpose: >-
  Verifiera att EA Stödjare resonerar korrekt inom enterprise architecture,
  håller evidens och rekommendationer isär, använder research ansvarsfullt och
  respekterar v1-scope.
result_levels:
  pass:
    minimum_score_percent: 80
    critical_failures_allowed: 0
  pass_with_warnings:
    minimum_score_percent: 65
    maximum_score_percent: 79
    critical_failures_allowed: 0
  fail:
    condition: critical_failure_or_score_below_65
release_gate:
  minimum_weighted_score_percent: 85
  blocking_cases_must_pass: true
