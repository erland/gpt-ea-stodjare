format: ea-stodjare-semantic-eval-suite
version: '2.0'
name: EA Stödjare – semantiska evals v2
language: sv-SE
purpose: 'Verifiera v1-baslinjens semantik samt v2-risker: projektprofil, faktisk projektmetamodell, extensions, Produkt/realisering,
  informationslager, migration, derived views och change-control.'
result_levels:
  pass:
    minimum_score_percent: 80
    critical_failures_allowed: 0
  pass_with_warnings:
    minimum_score_percent: 65
    maximum_score_percent: 79
    critical_failures_allowed: 0
  fail:
    condition: critical_failure_or_score_below_65
release_gate:
