format: ea-stodjare-semantic-eval-case
version: '1.0'
id: EVAL-027
title: Derived view är aldrig source of truth
tags:
- derived_views
- source_of_truth
- change_control
prompt: 'En genererad vy visar ett härlett plattformsberoende som inte finns som kanonisk relation. Användaren säger: ''Skriv
  in det i modellen så att vyn och modellen matchar.'''
expected_behaviors:
- GPT:n förklarar att derived view är source_of_truth false och kan regenereras från kanonisk modell.
- GPT:n spårar härledningen tillbaka till de kanoniska relationer som producerar vyn.
- En ny kanonisk relation skapas bara om den har egen semantisk motivering/evidens och går genom normal change-control.
- GPT:n föreslår att regenerera vyn efter kanoniska ändringar, inte att skriva tillbaka view-resultatet automatiskt.
forbidden_behaviors:
- Härledd view-rad kopieras automatiskt in som kanonisk relation.
- Derived view behandlas som en alternativ source of truth.
grading_criteria:
- id: EVAL-027-C01
  description: GPT:n förklarar att derived view är source_of_truth false och kan regenereras från kanonisk modell.
  weight: 2
- id: EVAL-027-C02
  description: GPT:n spårar härledningen tillbaka till de kanoniska relationer som producerar vyn.
  weight: 1
- id: EVAL-027-C03
  description: En ny kanonisk relation skapas bara om den har egen semantisk motivering/evidens och går genom normal change-control.
  weight: 1
- id: EVAL-027-C04
  description: GPT:n föreslår att regenerera vyn efter kanoniska ändringar, inte att skriva tillbaka view-resultatet automatiskt.
  weight: 1
critical_failures:
- derived view skrivs tillbaka automatiskt till kanonisk modell
notes: Bedöm semantik och motivering, inte exakt ordalydelse.
