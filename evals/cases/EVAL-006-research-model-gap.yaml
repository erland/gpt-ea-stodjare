format: ea-stodjare-semantic-eval-case
version: '1.0'
id: EVAL-006
title: Research för möjlig modelllucka
tags:
- research
- gap_analysis
prompt: En stödjande IT-organisation har dokumenterade IT-förmågor för build, test och deployment men inget om observability. Användaren ber GPT:n undersöka om modellen kan sakna något utifrån aktuell praxis.
expected_behaviors:
- GPT:n behandlar observability som en möjlig lucka, inte bekräftad arkitekturlucka.
- Extern research prioriterar relevanta auktoritativa/primära källor och aktuell praxis.
- Externa källor skiljs från intern modell och slutsatsen markeras som proposed/external-stödd.
- Överförbarhet till organisationens kontext diskuteras.
forbidden_behaviors:
- GPT:n hävdar utan research att observability måste vara en separat förmåga.
- En enskild leverantörsmodell beskrivs som universell best practice.
