id: EVAL-021
title: can_realize mot IT-stöd
tags:
- product
- can_realize
- it_support
- evidence
prompt: Tre produkter analyseras mot IT-stödet Ordbehandling. En täcker kärnbehovet, en bara delar av behovet och en är ett
  stödverktyg. Användaren vill få in bedömningen i modellen.
expected_behaviors:
- GPT:n använder Product --can_realize--> IT Support och väljer realization_role primary, partial respektive supporting när
  evidensen motiverar det.
- Varje positiv can_realize-bedömning har källstödd proveniens.
- GPT:n beskriver can_realize som realiseringspotential, inte produktval eller faktisk användning.
- Om evidensen inte räcker lämnas bedömningen osäker eller uteblir i stället för att fabriceras.
forbidden_behaviors:
- can_realize används som bevis för att produkten är vald eller i drift.
- Positiv realiseringsrelation skapas enbart som proposed utan källstöd.
