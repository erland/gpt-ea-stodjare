- id: EVAL-024-C03
  description: provided_by skapas först när konceptuell hemvist kan verifieras.
  weight: 1
- id: EVAL-024-C04
  description: GPT:n redovisar migrationsosäkerheten explicit i plan/rapport.
  weight: 1
critical_failures:
- blind realized_by→provided_by migration
- relationsdata eller proveniens tappas
notes: Bedöm semantik och motivering, inte exakt ordalydelse.
