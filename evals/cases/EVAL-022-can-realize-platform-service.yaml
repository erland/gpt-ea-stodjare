id: EVAL-022
title: can_realize mot Plattformstjänst
tags:
- product
- can_realize
- platform_service
- evidence
prompt: Användaren vill bedöma om en containerplattformprodukt, ett ramverk och en SaaS-tjänst kan realisera olika Plattformstjänster.
expected_behaviors:
- GPT:n använder Product --can_realize--> Platform Service oberoende av product_kind när semantiken och evidensen stödjer
  det.
- Plattformstjänsten förblir realiseringsneutral och definieras inte utifrån den analyserade produkten.
- realization_role används för att precisera produktens bidrag.
- GPT:n håller marknadspotential separat från faktisk organisationsrealisering.
forbidden_behaviors:
- Plattformstjänsten byter namn/definition till produktnamnet.
- Endast platform_product tillåts realisera Plattformstjänst.
