prompt: En full EA-v1-modell innehåller ett godkänt mål och flera IT-stöd men inga dokumenterade förmågor mellan dem. Vad bör GPT:n säga?
expected_behaviors:
- GPT:n identifierar en dokumentations-/spårbarhetslucka.
