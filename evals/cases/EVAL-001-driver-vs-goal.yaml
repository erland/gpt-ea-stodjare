id: EVAL-001
title: Drivkraft kontra mål
tags:
- classification
- driver_vs_goal
prompt: 'Ett strategidokument säger: ''Ökade krav på digital tillgänglighet och kortare ledtider förändrar verksamhetens förutsättningar. Till 2028 ska 90 procent av standardärendena kunna hanteras helt digitalt.'' Klassificera de två utsagorna.'
expected_behaviors:
- Den första utsagan klassificeras som drivkraft eller drivande förändring.
- Den andra utsagan klassificeras som mål eftersom den uttrycker ett önskat mätbart framtida tillstånd.
- Motiveringen skiljer orsak/förändringstryck från önskat resultat.
forbidden_behaviors:
- Båda utsagorna klassificeras som mål utan reservation.
- GPT:n skapar nya organisationsfakta som inte finns i texten.
grading_criteria:
