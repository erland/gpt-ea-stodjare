notes:
  - OpenAI Plugin är skills-first och bevarar canonical instruktion, Builder Knowledge och project-first/metamodel-first-regler.
  - Full verifierad projektändring kräver filesystem read/write, code execution och persistent workspace-state.
  - Projektfiler är auktoritativ state; chattminne är aldrig fallback för ett öppnat EA-projekt.
  - Webbresearch är villkorligt krav för uppgifter om aktuell standard, ramverk, marknad, produkt eller praxis.
  - DOCX/PDF-export kräver externa hostverktyg utöver Python.
