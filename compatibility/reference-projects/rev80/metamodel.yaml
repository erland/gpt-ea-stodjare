compatibility_rules:
- id: REV80-C001
  rule: Läs rev80 som v1-baserat extended legacy project; applicera inte framtida v2-standardsemantik utan explicit migration.
- id: REV80-C002
  rule: Bevara CAP in_scope/out_of_scope och consumer_scope som aktiv projektextension.
- id: REV80-C003
  rule: Tolka aktiva PLT som konceptuella plattformar.
- id: REV80-C004
  rule: Tolka PLS realized_by PLT som konceptuell hemvist i rev80, inte som faktisk produktrealisering.
- id: REV80-C005
  rule: Produktdata i supporting/ är marknadsreferens och får inte uppgraderas till organisationsfakta utan evidens.
- id: REV80-C006
  rule: Actual-platform-kandidaterna är pensionerade experiment och ska inte återaktiveras vid öppning eller migration.
- id: REV80-C007
  rule: Derived query/presentation views är inte source of truth.
- id: REV80-C008
  rule: Baseline/freeze och stable-ID/change-control ska respekteras vid fortsatt arbete.
migration_notes_for_future_steps:
- provided_by kan senare ersätta rev80:s konceptuella PLS realized_by PLT, men endast genom explicit migrering med rapport.
- Marknadsprodukter kan senare mappas till v2 Product utan att påstå actual usage.
- Deployment, openness och platform maturity lämpar sig som optional extensions.
- Relation roles och derived views bör bevaras som explicit extension/reporting semantics.
