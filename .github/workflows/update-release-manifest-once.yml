name: Update release workflow manifest once

on:
  push:
    branches:
      - fix/manual-release-only

permissions:
  contents: write

jobs:
  update-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/manual-release-only
      - name: Update release workflow hash in project manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          workflow = Path('.github/workflows/release.yml')
          manifest_path = Path('project-manifest.json')
          digest = hashlib.sha256(workflow.read_bytes()).hexdigest()
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in data['files']:
              if item.get('path') == '.github/workflows/release.yml':
                  item['sha256'] = digest
                  break
          else:
              raise SystemExit('release.yml missing from project-manifest.json')
          manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(digest)
          PY
      - name: Remove one-time workflow and commit manifest
        shell: bash
        run: |
          rm .github/workflows/update-release-manifest-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-manifest.json .github/workflows/update-release-manifest-once.yml
          git commit -m "Update manifest hash for release workflow"
          git push origin HEAD:fix/manual-release-only
