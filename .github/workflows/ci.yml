name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  v2-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Run mandatory v2 CI gate
        run: |
          python scripts/run_v2_ci_gate.py \
            --project-root . \
            --mode ci \
            --full-pytest \
            --report-file build/v2-ci-gate.json

      - name: Upload v2 CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ea-stodjare-v2-ci-report
          path: |
            build/v2-ci-gate.json
            build/validation-report.json
          if-no-files-found: warn
