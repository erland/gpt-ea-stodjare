name: Build GPT distributions

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG='${{ github.event.release.tag_name }}'
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $TAG (expected v<semver>)" >&2
              exit 1
            fi
            VERSION="${TAG#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run mandatory v2 distribution gate
        run: |
          python scripts/run_v2_ci_gate.py \
            --project-root . \
            --mode ci \
            --version "${{ steps.version.outputs.version }}" \
            --report-file build/v2-distribution-gate.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ea-stodjare-gpt-v${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            build/v2-distribution-gate.json
          retention-days: 14

  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: ea-stodjare-gpt-v${{ needs.build.outputs.version }}
          path: dist
      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber --repo "${{ github.repository }}"
