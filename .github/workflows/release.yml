name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Taggen måste följa vMAJOR.MINOR.PATCH, exempelvis v1.0.0" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Run mandatory v2 release gate
        run: |
          mkdir -p dist
          python scripts/run_v2_ci_gate.py \
            --project-root . \
            --mode release \
            --version "${GITHUB_REF_NAME#v}" \
            --full-pytest \
            --report-file dist/v2-release-gate.json

      - name: Build release package
        run: python scripts/package_release.py --project-root . --output-dir dist

      - name: Verify final release package can be unpacked and validated
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          unzip -q "dist/ea-stodjare-${GITHUB_REF_NAME#v}.zip" -d "$tmp"
          python "$tmp/ea-stodjare-${GITHUB_REF_NAME#v}/scripts/validate_project.py" \
            --project-root "$tmp/ea-stodjare-${GITHUB_REF_NAME#v}" \
            --repo-root "$tmp/ea-stodjare-${GITHUB_REF_NAME#v}" \
            --no-generated

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ea-stodjare-${{ github.ref_name }}
          path: |
            dist/ea-stodjare-*.zip
            dist/ea-stodjare-*.release.json
            dist/v2-release-gate.json
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ea-stodjare-*.zip \
            dist/ea-stodjare-*.release.json \
            dist/v2-release-gate.json \
            --verify-tag \
            --generate-notes \
            --title "EA Stödjare ${GITHUB_REF_NAME#v}"
