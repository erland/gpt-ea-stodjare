name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish or repair (e.g. v2.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Taggen måste följa vMAJOR.MINOR.PATCH, exempelvis v1.0.0" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Install and verify GPT Byggaren 1.6.33
        uses: ./.github/actions/setup-gpt-engine

      - name: Run mandatory v2 release gate
        run: |
          mkdir -p dist
          python scripts/run_v2_ci_gate.py \
            --project-root . \
            --mode release \
            --version "${RELEASE_TAG#v}" \
            --full-pytest \
            --report-file dist/v2-release-gate.json

      - name: Build release package
        run: python scripts/package_release.py --project-root . --output-dir dist --version "${RELEASE_TAG#v}"

      - name: Verify final release package can be unpacked and validated
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          unzip -q "dist/ea-stodjare-${RELEASE_TAG#v}.zip" -d "$tmp"
          python "$tmp/ea-stodjare-${RELEASE_TAG#v}/scripts/validate_project.py" \
            --project-root "$tmp/ea-stodjare-${RELEASE_TAG#v}" \
            --repo-root "$tmp/ea-stodjare-${RELEASE_TAG#v}" \
            --no-generated

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ea-stodjare-${{ env.RELEASE_TAG }}
          path: |
            dist/ea-stodjare-*.zip
            dist/ea-stodjare-*.release.json
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
            dist/v2-release-gate.json
          if-no-files-found: error

      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.zip dist/*.release.json dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json dist/v2-release-gate.json)
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets were produced' >&2; exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading verified assets without modifying release metadata"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
